name: lembretes

# Chama o Fidelize a cada 5 minutos para enviar o "está tudo certo?" dos agendamentos que começam em ~30 min.
# Precisa do segredo CRON_SECRET (o mesmo valor configurado na Vercel). A URL padrão é a de produção; para outra, defina a variável APP_URL.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar lembretes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://fidelize-nu.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::Segredo CRON_SECRET não configurado no GitHub."; exit 1; fi
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 50 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/lembretes")
          cat resp.json; echo
          [ "$code" = "200" ] || { echo "::error::HTTP $code"; exit 1; }
      - name: Avisar se falhou
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          [ -n "$ALERT_WEBHOOK_URL" ] || exit 0
          msg="Fidelize: o workflow de lembretes falhou ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' -d "{\"text\":\"$msg\",\"content\":\"$msg\"}" "$ALERT_WEBHOOK_URL" || true

