name: ci

# Roda em todo pull request que mexe no app: tipos, testes unitários, build e os testes de tela (Playwright) contra um Postgres de verdade.
on:
  pull_request:
    paths:
      - "fidelidade-saas/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "fidelidade-saas/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fidelidade-saas

jobs:
  qualidade:
    name: Tipos e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fidelidade-saas/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelidade?schema=public
          SESSION_SECRET: ci-session-secret-0123456789abcdef

  telas:
    name: Testes de tela (e2e)
    needs: qualidade
    # Fixo: o ubuntu-latest virou 26.04, que o Playwright ainda não suporta (não instala o Chromium).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelidade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelidade?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      CRON_SECRET: segredo-de-teste-1234567890
      SUPPORT_EMAIL: suporte@exemplo.com
      SUPPORT_WHATSAPP: "5511975944834"
      RESEND_API_KEY: re_fake
      DEV_MAIL_FILE: /tmp/dev-mail.jsonl
      # Conferência das avaliações do Google em modo de teste: as avaliações vêm de um arquivo, não do Google.
      GOOGLE_REVIEWS_PROVIDER: mock
      GOOGLE_REVIEWS_MOCK_FILE: /tmp/google-mock.json
      GOOGLE_TOKEN_KEY: chave-de-teste-do-google-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fidelidade-saas/package-lock.json
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Criar as tabelas (migrações)
        run: npx prisma migrate deploy
      - name: Subir o app (modo desenvolvimento, que aceita o pagamento simulado)
        run: bash tests/e2e/subir-app.sh
      - name: Testes de tela (1ª metade)
        run: |
          # Mesma ordem do run.sh (o e2e.mjs cria os dados que os seguintes usam), em duas metades.
          mapfile -t todos < <(echo e2e; ls tests/e2e/e2e[0-9]*.mjs | xargs -n1 basename | sed 's/\.mjs$//' | sort -V)
          meio=$(( ${#todos[@]} / 2 ))
          printf '%s\n' "${todos[@]:0:$meio}" > /tmp/e2e-parte1
          printf '%s\n' "${todos[@]:$meio}" > /tmp/e2e-parte2
          tests/e2e/run.sh $(cat /tmp/e2e-parte1)
      - name: Reiniciar o app entre as metades (a memória do modo desenvolvimento só cresce)
        if: ${{ !cancelled() }}
        run: bash tests/e2e/subir-app.sh
      - name: Testes de tela (2ª metade)
        if: ${{ !cancelled() }}
        run: tests/e2e/run.sh $(cat /tmp/e2e-parte2)
      - name: Registro do servidor se falhou
        if: failure()
        run: tail -n 120 /tmp/app.log || true
      - name: Guardar prints e registros se falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-saida
          path: |
            fidelidade-saas/tests/e2e/out/*.log
            fidelidade-saas/tests/e2e/out/*.png
            /tmp/app.log
          if-no-files-found: ignore
          retention-days: 7
