name: yt-channel

on:
  schedule:
    - cron: "0 12 * * 2,5"     # terça e sexta, 09:00 (Brasília)
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema avulso (vazio = próximo de data/topics.yaml)"
        required: false
      wiki:
        description: "Título do artigo da Wikipédia para o tema avulso"
        required: false
      note:
        description: "Orientação de abordagem para o roteiro (ex.: tom e cuidados do tema)"
        required: false
      upload:
        description: "Enviar ao YouTube (privado)?"
        type: boolean
        default: true
      reuse_run_id:
        description: "ID de uma execução anterior: sobe o vídeo dela, sem gerar nada novo (não gasta API)"
        required: false

permissions:
  contents: write              # para commitar data/published.json
  actions: read                # para baixar o artefato de uma execução anterior

concurrency: yt-channel

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: yt-channel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yt-channel/requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
        working-directory: .

      - run: pip install -r requirements.txt

      - run: python -m pytest -q tests

      - name: Baixar vídeo de uma execução anterior
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: video-${{ github.event.inputs.reuse_run_id }}
          path: yt-channel/output
          run-id: ${{ github.event.inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Gerar vídeo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          WIKI_CONTACT: ${{ secrets.WIKI_CONTACT || format('https://github.com/{0}', github.repository) }}
          CH_TOPIC: ${{ github.event.inputs.topic }}
          CH_WIKI: ${{ github.event.inputs.wiki }}
          CH_NOTE: ${{ github.event.inputs.note }}
          CH_UPLOAD: ${{ github.event.inputs.upload }}
          CH_REUSE: ${{ github.event.inputs.reuse_run_id }}
        run: python -m channel.run

      - name: Registrar tema usado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/published.json ] && git add data/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: registra vídeo publicado [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_id }}
          path: yt-channel/output
          retention-days: 7
