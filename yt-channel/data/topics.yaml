# --- História bíblica: o roteiro atribui o relato ao texto e separa o que diz a pesquisa histórica ---
- title: O Êxodo do Egito
  wiki: Livro do Êxodo
  note: &nota_biblica >-
    Conte o relato bíblico com respeito, sempre atribuindo ao texto ("segundo o Livro do Êxodo...").
    Quando a fonte trouxer o que historiadores e arqueólogos dizem, apresente em trechos separados,
    com expressões como "segundo a pesquisa histórica...", sem afirmar nem negar a fé e sem ridicularizar
    nenhuma posição. Não trate o relato como fato histórico comprovado nem como falso: descreva o que o texto
    narra e o que a evidência mostra ou deixa em aberto. Não invente falas, números ou detalhes de cenas.
